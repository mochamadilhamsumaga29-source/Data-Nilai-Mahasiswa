<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Nilai Mahasiswa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <!-- Komponen 1: Navbar -->
    <nav class="navbar navbar-dark bg-utama">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Data Nilai Mahasiswa</span>
        <span class="text-white small">Lulus jika nilai &ge; 75</span>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <div class="row g-4">

      <!-- Kolom kiri: form input -->
      <section class="col-md-5">
        <!-- Komponen 2: Card -->
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Input Data</h2>
            
            <!-- Komponen 3: Form -->
            <form id="formNilai" novalidate>
              <div class="mb-3">
                <label for="nama" class="form-label">Nama</label>
                <input type="text" id="nama" class="form-control">
                <div class="invalid-feedback" id="pesanNama"></div>
              </div>
              <div class="mb-3">
                <label for="nim" class="form-label">NIM</label>
                <input type="text" id="nim" class="form-control">
                <div class="invalid-feedback" id="pesanNim"></div>
              </div>
              <div class="mb-3">
                <label for="nilai" class="form-label">Nilai (0 - 100)</label>
                <input type="number" id="nilai" class="form-control">
                <div class="invalid-feedback" id="pesanNilai"></div>
              </div>
              <!-- Komponen 4: Button -->
              <button type="submit" class="btn btn-primary">Tambah Data</button>
            </form>

            <!-- Komponen 5: Alert (diisi JavaScript) -->
            <div id="pesanSukses" class="mt-3"></div>
          </div>
        </div>
      </section>

      <!-- Kolom kanan: filter dan tabel -->
      <section class="col-md-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Daftar Nilai</h2>
          <select id="filterStatus" class="form-select w-auto">
            <option value="semua">Semua</option>
            <option value="lulus">Lulus</option>
            <option value="tidak">Tidak Lulus</option>
          </select>
        </div>

        <!-- Komponen 6: Table -->
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>NIM</th>
                <th>Nilai</th>
                <th>Grade</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="isiTabel"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <footer class="text-center py-3 footer-utama">
    <p class="mb-0">&copy; 2026 Data Nilai Mahasiswa</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
